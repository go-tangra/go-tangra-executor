syntax = "proto3";

package executor.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// A single file within an action package (e.g. index.js for a scripted action).
message ActionFile {
  string path = 1 [json_name = "path"];       // relative path within the package
  string content = 2 [json_name = "content"]; // file content
}

// An action package: a go-tangra-actions action.yaml manifest plus optional
// package files. Actions are the reusable units referenced by workflows.
message Action {
  string id = 1 [json_name = "id"];
  uint32 tenant_id = 2 [json_name = "tenantId"];
  string name = 3 [json_name = "name"];
  string description = 4 [json_name = "description"];
  string using = 5 [json_name = "using"];               // composite | javascript | lua | ...
  string manifest = 6 [json_name = "manifest"];         // the action.yaml content
  string content_hash = 7 [json_name = "contentHash"];
  int32 version = 8 [json_name = "version"];
  bool enabled = 9 [json_name = "enabled"];
  repeated ActionFile files = 10 [json_name = "files"]; // package files (excludes action.yaml)
  google.protobuf.Timestamp created_at = 11 [json_name = "createdAt"];
  google.protobuf.Timestamp updated_at = 12 [json_name = "updatedAt"];
}

// Admin-facing CRUD service for the action repository.
service ExecutorActionService {
  rpc CreateAction(CreateActionRequest) returns (CreateActionResponse) {
    option (google.api.http) = {
      post: "/v1/actions"
      body: "*"
    };
  }

  rpc GetAction(GetActionRequest) returns (GetActionResponse) {
    option (google.api.http) = {
      get: "/v1/actions/{id}"
    };
  }

  rpc ListActions(ListActionsRequest) returns (ListActionsResponse) {
    option (google.api.http) = {
      get: "/v1/actions"
    };
  }

  rpc UpdateAction(UpdateActionRequest) returns (UpdateActionResponse) {
    option (google.api.http) = {
      put: "/v1/actions/{id}"
      body: "*"
    };
  }

  rpc DeleteAction(DeleteActionRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/v1/actions/{id}"
    };
  }
}

message CreateActionRequest {
  string name = 1 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  string description = 2 [json_name = "description"];
  string manifest = 3 [
    json_name = "manifest",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];
  repeated ActionFile files = 4 [json_name = "files"];
  bool enabled = 5 [json_name = "enabled"];
}

message CreateActionResponse {
  Action action = 1 [json_name = "action"];
}

message GetActionRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];
}

message GetActionResponse {
  Action action = 1 [json_name = "action"];
}

message ListActionsRequest {
  optional uint32 page = 1 [json_name = "page"];
  optional uint32 page_size = 2 [json_name = "pageSize"];
  optional string name = 3 [json_name = "name"];
  optional string using = 4 [json_name = "using"];
  optional bool enabled = 5 [json_name = "enabled"];
}

message ListActionsResponse {
  repeated Action actions = 1 [json_name = "actions"];
  uint32 total = 2 [json_name = "total"];
}

message UpdateActionRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];
  optional string description = 2 [json_name = "description"];
  // When manifest is set the package content is replaced: files below replace
  // the full file set, the content hash is recomputed and the version bumped.
  optional string manifest = 3 [json_name = "manifest"];
  repeated ActionFile files = 4 [json_name = "files"];
  optional bool enabled = 5 [json_name = "enabled"];
  optional string password = 6 [json_name = "password"];
}

message UpdateActionResponse {
  Action action = 1 [json_name = "action"];
}

message DeleteActionRequest {
  string id = 1 [
    json_name = "id",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1}
  ];
}
