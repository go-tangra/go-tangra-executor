syntax = "proto3";

package executor.service.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";
import "redact/v3/redact.proto";

import "executor/service/v1/script.proto";
import "executor/service/v1/action.proto";

// Type of command sent to a client
enum CommandType {
  COMMAND_TYPE_SCRIPT_EXECUTION = 0; // default, backward compatible
  COMMAND_TYPE_CLIENT_UPDATE = 1;    // trigger client self-update
  COMMAND_TYPE_ACTION_EXECUTION = 2; // run a go-tangra-actions workflow
}

// Execution command sent to client via stream
message ExecutionCommand {
  string command_id = 1 [json_name = "commandId"];
  string execution_id = 2 [json_name = "executionId"];
  string script_id = 3 [json_name = "scriptId"];
  string script_name = 4 [json_name = "scriptName"];
  ScriptType script_type = 5 [json_name = "scriptType"];
  string content = 6 [json_name = "content", (redact.v3.value).string = ""];
  string content_hash = 7 [json_name = "contentHash", (redact.v3.value).string = ""];
  CommandType command_type = 8 [json_name = "commandType"];
  string target_version = 9 [json_name = "targetVersion"]; // empty = latest

  // For COMMAND_TYPE_ACTION_EXECUTION: the workflow YAML to run and its inputs.
  string workflow = 10 [json_name = "workflow"];
  map<string, string> inputs = 11 [json_name = "inputs"];
}

// Client-facing service (called by go-tangra-client daemon)
service ExecutorClientService {
  // Fetch a script (validates mTLS CN assignment)
  rpc FetchScript(FetchScriptRequest) returns (FetchScriptResponse) {
    option (google.api.http) = {
      get: "/v1/client/scripts/{script_id}"
    };
  }

  // Stream execution commands (server-side streaming)
  rpc StreamCommands(StreamCommandsRequest) returns (stream ExecutionCommand) {}

  // Acknowledge a command (accepted or rejected)
  rpc AckCommand(AckCommandRequest) returns (AckCommandResponse) {
    option (google.api.http) = {
      post: "/v1/client/commands/{command_id}/ack"
      body: "*"
    };
  }

  // Report execution result
  rpc ReportResult(ReportResultRequest) returns (ReportResultResponse) {
    option (google.api.http) = {
      post: "/v1/client/executions/{execution_id}/result"
      body: "*"
    };
  }

  // Submit a complete execution log (client-pull scenario)
  rpc SubmitExecution(SubmitExecutionRequest) returns (SubmitExecutionResponse) {
    option (google.api.http) = {
      post: "/v1/client/executions"
      body: "*"
    };
  }

  // Get metadata about the latest client release the executor has cached for a
  // given platform. Lets clients check for updates via the executor instead of
  // hitting GitHub directly (avoids GitHub rate limits across a fleet).
  rpc GetLatestClientRelease(GetLatestClientReleaseRequest) returns (GetLatestClientReleaseResponse) {}

  // Download a cached client binary as a stream of raw byte chunks.
  rpc DownloadClientBinary(DownloadClientBinaryRequest) returns (stream ClientBinaryChunk) {}

  // Resolve an action package by name so go-tangra-actions can execute it on the
  // host. Returns the action.yaml manifest plus the package files, feeding the
  // engine's action Resolver.
  rpc ResolveAction(ResolveActionRequest) returns (ResolveActionResponse) {}

  // Stream live execution output (logs) from a running workflow back to the
  // executor as it is produced, GitHub-Actions style. Client-streaming: the
  // client sends many chunks and the executor appends them to the execution log.
  rpc StreamExecutionOutput(stream ExecutionOutputChunk) returns (StreamExecutionOutputResponse) {}
}

// A chunk of live execution output streamed from a client.
message ExecutionOutputChunk {
  string execution_id = 1 [
    json_name = "executionId",
    (buf.validate.field).string = {min_len: 1, max_len: 36}
  ];
  string stream = 2 [json_name = "stream"]; // "stdout" | "stderr"
  bytes data = 3 [json_name = "data"];
  string job = 4 [json_name = "job"];
  string step = 5 [json_name = "step"];
}

message StreamExecutionOutputResponse {
  bool recorded = 1 [json_name = "recorded"];
  int64 chunks = 2 [json_name = "chunks"];
}

// Resolve an action package by name (the workflow `uses:` reference).
message ResolveActionRequest {
  string name = 1 [
    json_name = "name",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
}

// An action package returned to the host for execution.
message ResolveActionResponse {
  string name = 1 [json_name = "name"];
  string manifest = 2 [json_name = "manifest"];   // the action.yaml content
  repeated ActionFile files = 3 [json_name = "files"]; // supporting package files
  int32 version = 4 [json_name = "version"];
}

// Fetch script request
message FetchScriptRequest {
  string script_id = 1 [
    json_name = "scriptId",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 36}
  ];
}

message FetchScriptResponse {
  string script_id = 1 [json_name = "scriptId"];
  string script_name = 2 [json_name = "scriptName"];
  ScriptType script_type = 3 [json_name = "scriptType"];
  string content = 4 [json_name = "content", (redact.v3.value).string = ""];
  string content_hash = 5 [json_name = "contentHash", (redact.v3.value).string = ""];
  int32 version = 6 [json_name = "version"];
}

// Stream commands request
message StreamCommandsRequest {
  string client_id = 1 [
    json_name = "clientId",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  string client_version = 2 [json_name = "clientVersion"];
  // Whether this host is eligible to run go-tangra-actions workflows (the client
  // sets this from the ACTIONS_ENABLED env var). The executor refuses to push
  // workflow executions to hosts that report false.
  bool actions_enabled = 3 [json_name = "actionsEnabled"];
  // Whether the client detected systemd security hardening (read-only/sandboxed
  // filesystem from ProtectSystem/ProtectHome/etc.) that would make most actions
  // fail. The client probes this at connect time; true = hardened = host-ops
  // actions are likely to fail even when actions_enabled is true.
  bool security_hardened = 4 [json_name = "securityHardened"];
}

// Ack command request
message AckCommandRequest {
  string command_id = 1 [
    json_name = "commandId",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 36}
  ];

  bool accepted = 2 [json_name = "accepted"];

  optional string rejection_reason = 3 [
    json_name = "rejectionReason",
    (buf.validate.field).string = {max_len: 1024}
  ];
}

message AckCommandResponse {
  bool acknowledged = 1 [json_name = "acknowledged"];
}

// Report result request
message ReportResultRequest {
  string execution_id = 1 [
    json_name = "executionId",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 36}
  ];

  int32 exit_code = 2 [json_name = "exitCode"];
  string output = 3 [json_name = "output", (redact.v3.value).string = ""];
  string error_output = 4 [json_name = "errorOutput", (redact.v3.value).string = ""];
  int64 duration_ms = 5 [json_name = "durationMs"];
}

message ReportResultResponse {
  bool recorded = 1 [json_name = "recorded"];
}

// Submit execution request (client-pull: creates log + stores result in one shot)
message SubmitExecutionRequest {
  string script_id = 1 [
    json_name = "scriptId",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 36}
  ];

  int32 exit_code = 2 [json_name = "exitCode"];
  string output = 3 [json_name = "output", (redact.v3.value).string = ""];
  string error_output = 4 [json_name = "errorOutput", (redact.v3.value).string = ""];
  int64 duration_ms = 5 [json_name = "durationMs"];
}

message SubmitExecutionResponse {
  string execution_id = 1 [json_name = "executionId"];
  bool recorded = 2 [json_name = "recorded"];
}

// Request the latest cached client release for a platform.
message GetLatestClientReleaseRequest {
  string os = 1 [json_name = "os"];     // runtime.GOOS, e.g. "linux"
  string arch = 2 [json_name = "arch"]; // runtime.GOARCH, e.g. "amd64"
}

// Metadata describing the latest client release cached by the executor.
message GetLatestClientReleaseResponse {
  bool available = 1 [json_name = "available"];        // executor has a binary cached for this platform
  string version = 2 [json_name = "version"];          // semantic version, no "v" prefix
  string binary_name = 3 [json_name = "binaryName"];   // asset name for the requested platform
  string sha256 = 4 [json_name = "sha256"];            // hex-encoded SHA-256 of the binary
  int64 size = 5 [json_name = "size"];                 // binary size in bytes
  string release_url = 6 [json_name = "releaseUrl"];   // upstream release page URL
}

// Request to download a specific cached client binary.
message DownloadClientBinaryRequest {
  string binary_name = 1 [
    json_name = "binaryName",
    (google.api.field_behavior) = REQUIRED,
    (buf.validate.field).string = {min_len: 1, max_len: 255}
  ];
  string version = 2 [json_name = "version"]; // optional; echoed for validation/logging
}

// A chunk of binary data streamed from the executor.
message ClientBinaryChunk {
  bytes data = 1 [json_name = "data"];
}
