                        - SCRIPT_TYPE_UNSPECIFIED
                        - SCRIPT_TYPE_BASH
                        - SCRIPT_TYPE_JAVASCRIPT
                        - SCRIPT_TYPE_LUA
                    type: string
                    format: enum
                content:
                    type: string
                contentHash:
                    type: string
                version:
                    type: integer
                    format: int32
                enabled:
                    type: boolean
                createdBy:
                    type: integer
                    format: uint32
                updatedBy:
                    type: integer
                    format: uint32
                createTime:
                    type: string
                    format: date-time
                updateTime:
                    type: string
                    format: date-time
            description: Script entity
        ScriptAssignment:
            type: object
            properties:
                id:
                    type: string
                tenantId:
                    type: integer
                    format: uint32
                scriptId:
                    type: string
                clientId:
                    type: string
                createdBy:
                    type: integer
                    format: uint32
                createTime:
                    type: string
                    format: date-time
                script:
                    allOf:
                        - $ref: '#/components/schemas/Script'
                    description: Optionally populated when listing
            description: Script assignment entity
        SubmitExecutionRequest:
            required:
                - scriptId
            type: object
            properties:
                scriptId:
                    type: string
                exitCode:
                    type: integer
                    format: int32
                output:
                    type: string
                errorOutput:
                    type: string
                durationMs:
                    type: string
            description: 'Submit execution request (client-pull: creates log + stores result in one shot)'
        SubmitExecutionResponse:
            type: object
            properties:
                executionId:
                    type: string
                recorded:
                    type: boolean
        TriggerClientUpdateRequest:
            required:
                - clientId
            type: object
            properties:
                clientId:
                    type: string
                targetVersion:
                    type: string
            description: Trigger client update request
        TriggerClientUpdateResponse:
            type: object
            properties:
                commandId:
                    type: string
                clientOnline:
                    type: boolean
        TriggerExecutionRequest:
            required:
                - scriptId
                - clientId
            type: object
            properties:
                scriptId:
                    type: string
                clientId:
                    type: string
            description: Trigger execution request
        TriggerExecutionResponse:
            type: object
            properties:
                execution:
                    $ref: '#/components/schemas/ExecutionLog'
        UpdateActionRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                version:
                    type: string
                description:
                    type: string
                manifest:
                    type: string
                enabled:
                    type: boolean
                files:
                    type: array
                    items:
                        $ref: '#/components/schemas/ActionFile'
                    description: When set, replaces the action's file set wholesale.
                replaceFiles:
                    type: boolean
                    description: Whether files were provided (distinguishes "clear all files" from "leave unchanged").
                password:
                    type: string
                    description: Password required when the package content (manifest or files) changes.
            description: Update action request
        UpdateActionResponse:
            type: object
            properties:
                action:
                    $ref: '#/components/schemas/Action'
        UpdateScriptRequest:
            required:
                - id
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                content:
                    type: string
                enabled:
                    type: boolean
                password:
                    type: string
                    description: Password required when content changes
            description: Update script request
        UpdateScriptResponse:
            type: object
            properties:
                script:
                    $ref: '#/components/schemas/Script'
tags:
    - name: BackupService
    - name: ExecutorActionService
      description: Action registry service
    - name: ExecutorAssignmentService
      description: Assignment management service
    - name: ExecutorClientService
      description: Client-facing service (called by go-tangra-client daemon)
    - name: ExecutorExecutionService
      description: Execution management service (UI/admin facing)
    - name: ExecutorScriptService
      description: Script management service
    - name: ExecutorStatisticsService
      description: Executor Statistics Service provides aggregated statistics about the execution system
